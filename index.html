<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Call to Summary – Role Play demo</title>
<meta name="description" content="A simulated walkthrough of the Role Play voice-AI training use case. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fafaf9; --panel:#ffffff; --ink:#111110; --muted:#6c6b66; --line:#e6e5e0; --soft:#f2f1ed;
    --blue:#1d6fe8; --blue-soft:#eaf2ff; --blue-line:#bcd5fb; --green:#16a34a; --red:#dc2626;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e0e0d; --panel:#161615; --ink:#f3f3f0; --muted:#9a9993; --line:#2a2a27; --soft:#212120;
      --blue:#6aa6ff; --blue-soft:#12233c; --blue-line:#244a82;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e0e0d; --panel:#161615; --ink:#f3f3f0; --muted:#9a9993; --line:#2a2a27; --soft:#212120;
    --blue:#6aa6ff; --blue-soft:#12233c; --blue-line:#244a82;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:inherit; }

  /* top bar */
  .top { display:flex; align-items:center; gap:12px; padding:16px 24px; max-width:1360px; margin:0 auto; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; text-decoration:none; letter-spacing:-.02em; }
  .logo svg { width:20px; height:20px; }
  .langsel { position:relative; }
  .langsel select { appearance:none; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 30px 6px 12px; font-size:13px; color:var(--ink); cursor:pointer; }
  .langsel::after { content:""; position:absolute; right:12px; top:50%; width:6px; height:6px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .spacer { flex:1; }
  .icon-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; }
  .visit { background:var(--ink); color:var(--bg); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; text-decoration:none; white-space:nowrap; }

  main { max-width:1360px; margin:0 auto; padding:0 24px 40px; }
  .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; padding:22px 0 18px; border-top:1px solid var(--line); }
  h1 { margin:0 0 8px; font-size:34px; line-height:1.1; letter-spacing:-.025em; font-weight:600; }
  .desc { margin:0; max-width:560px; color:var(--muted); font-size:14px; }
  .disc { margin:8px 0 0; max-width:560px; color:var(--ink); font-size:12.5px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pill { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 12px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .pill b { color:var(--blue); font-family:var(--mono); font-weight:600; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel); }
  .seg button { border:0; background:none; padding:6px 11px; font-size:12px; color:var(--muted); }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .btn { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 14px; font-size:12px; font-weight:500; }
  .btn.dark { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .bar { height:2px; background:var(--line); margin:0 0 14px; }
  .bar i { display:block; height:100%; width:0; background:var(--ink); transition:width .15s linear; }

  .stage { display:grid; grid-template-columns:230px minmax(0,1fr) 260px; gap:12px; align-items:stretch; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .cap { display:flex; justify-content:space-between; font:500 10px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:14px 14px 8px; }
  .pipe { padding-bottom:8px; }
  .step { display:flex; gap:10px; margin:2px 8px; padding:9px 8px; border-radius:8px; cursor:pointer; align-items:flex-start; }
  .step:hover { background:var(--soft); }
  .step.active { background:var(--soft); }
  .num { flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); font:500 11px var(--mono); display:grid; place-items:center; background:var(--panel); color:var(--muted); margin-top:1px; }
  .step.active .num { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .step.done .num { color:var(--ink); }
  .st-title { font-weight:500; font-size:13.5px; line-height:1.25; }
  .st-sub { font-size:11px; color:var(--muted); margin:1px 0 4px; }
  .tag { display:inline-block; font:600 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); border-radius:4px; padding:1px 6px; }
  .tag.trainee { color:var(--blue); border-color:var(--blue-line); background:var(--blue-soft); }
  .tag.live { color:var(--red); border-color:#f3c0c0; background:rgba(220,38,38,.06); }

  .win { display:flex; flex-direction:column; min-height:560px; overflow:hidden; }
  .win-head { background:var(--soft); border-bottom:1px solid var(--line); height:38px; padding:0 14px; display:flex; align-items:center; gap:7px; font:12px var(--mono); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .win-head .ttl { margin-left:8px; color:var(--ink); }
  .win-head .lbl { margin-left:auto; color:var(--muted); font-size:11px; }
  .win-body { flex:1; padding:20px; position:relative; overflow:auto; }
  .win-foot { border-top:1px solid var(--line); padding:12px 16px; font-size:13px; color:var(--muted); display:flex; gap:12px; background:var(--soft); }
  .win-foot .n { font:500 12px var(--mono); color:var(--ink); }

  .log { display:flex; flex-direction:column; min-height:560px; }
  .log-list { flex:1; overflow-y:auto; padding:0 14px 14px; max-height:560px; }
  .li { display:grid; grid-template-columns:40px 1fr; gap:8px; padding:8px 0; font-size:12.5px; animation:fade .3s ease; }
  .li .tm { font:11px var(--mono); color:var(--muted); padding-top:1px; }
  .li .tx { line-height:1.35; }
  .li .src { display:block; font:600 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .li .src.trainee { color:var(--blue); }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

  /* step 1 */
  .choose { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:640px; margin:10px auto 0; }
  .chc { border:1px solid var(--line); border-radius:14px; padding:22px 20px; background:var(--panel); transition:all .25s; position:relative; }
  .chc .ic { width:40px; height:40px; border-radius:11px; background:var(--soft); display:grid; place-items:center; margin-bottom:12px; }
  .chc b { display:block; font-size:16px; }
  .chc .uc { display:inline-block; margin:6px 0 8px; padding:2px 9px; border-radius:999px; background:var(--soft); font-size:11.5px; font-weight:600; }
  .chc p { margin:0; color:var(--muted); font-size:12.5px; }
  .chc.sel { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
  .chc.sel .uc { background:var(--blue-soft); color:var(--blue); }
  .chc .picked { position:absolute; top:12px; right:12px; font:600 9px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--blue); background:var(--blue-soft); border:1px solid var(--blue-line); border-radius:4px; padding:1px 6px; opacity:0; transition:opacity .2s; }
  .chc.sel .picked { opacity:1; }
  .hint { text-align:center; color:var(--muted); font-size:12.5px; margin:22px 0 0; }

  /* step 2 */
  .phone-wrap { display:grid; place-items:center; min-height:440px; }
  .phone { width:290px; border:1px solid var(--line); border-radius:24px; padding:30px 22px 24px; text-align:center; background:var(--panel); box-shadow:0 8px 30px rgba(0,0,0,.06); }
  .av { width:82px; height:82px; border-radius:50%; background:var(--soft); display:grid; place-items:center; margin:0 auto 14px; color:var(--muted); }
  .ring .av { animation:pulse 1.3s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(29,111,232,.45);} 70% { box-shadow:0 0 0 20px rgba(29,111,232,0);} 100% { box-shadow:0 0 0 0 rgba(29,111,232,0);} }
  .ph-lbl { color:var(--muted); font-size:13px; }
  .ph-who { font-size:19px; font-weight:600; margin-top:2px; }
  .ph-act { display:flex; justify-content:center; gap:34px; margin-top:22px; min-height:76px; }
  .rb { width:56px; height:56px; border-radius:50%; border:0; color:#fff; display:grid; place-items:center; transition:transform .15s; }
  .rb.g { background:var(--green); } .rb.r { background:var(--red); }
  .rb.pressed { transform:scale(.88); box-shadow:0 0 0 6px rgba(22,163,74,.25); }
  .ra small { display:block; margin-top:5px; color:var(--muted); font-size:11px; }
  .ph-st { margin-top:14px; font:11px var(--mono); color:var(--blue); min-height:16px; }

  /* step 3 */
  .live-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .ldot { width:8px; height:8px; border-radius:50%; background:var(--red); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .live-row b { font:600 11px var(--mono); letter-spacing:.08em; color:var(--red); }
  .timer { margin-left:auto; font:600 15px var(--mono); }
  .wave { display:flex; gap:3px; align-items:center; height:26px; margin-bottom:14px; }
  .wave i { width:3px; border-radius:2px; background:var(--ink); height:6px; animation:wv 1s ease-in-out infinite; opacity:.8; }
  .wave.off i { animation:none; height:3px; opacity:.25; }
  @keyframes wv { 0%,100% { height:5px; } 50% { height:24px; } }
  .bub { display:flex; flex-direction:column; margin:0 0 10px; max-width:78%; animation:fade .25s ease; }
  .bub .who { font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .bub .tx { background:var(--soft); border-radius:14px; padding:9px 13px; font-size:13.5px; line-height:1.45; }
  .bub.t { align-self:flex-end; align-items:flex-end; margin-left:auto; }
  .bub.t .tx { background:var(--ink); color:var(--bg); }
  .tr { display:flex; flex-direction:column; }

  /* step 4 */
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .box { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); display:flex; flex-direction:column; min-height:360px; }
  .box h4 { margin:0; padding:10px 14px; font-size:12.5px; font-weight:600; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .box .pad { padding:12px 14px; flex:1; font-size:13px; }
  .saved { font:500 11px var(--mono); color:var(--green); }
  .saved.saving { color:var(--muted); }
  .mini { font-size:12px; color:var(--muted); line-height:1.5; }
  .mini div { margin-bottom:7px; } .mini b { color:var(--ink); font-weight:600; }
  .caret::after { content:"▍"; color:var(--blue); animation:blink 1s infinite; margin-left:1px; }

  /* step 5 */
  .end { display:grid; place-items:center; text-align:center; min-height:440px; }
  .end .ck { width:64px; height:64px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:grid; place-items:center; margin:0 auto 14px; }
  .end h3 { margin:0; font-size:22px; letter-spacing:-.01em; }
  .end .dur { color:var(--muted); font:13px var(--mono); margin:4px 0 22px; }
  .bigbtn { border:0; background:var(--blue); color:#fff; padding:13px 22px; border-radius:10px; font-weight:600; font-size:14px; transition:transform .15s; }
  .bigbtn.pressed { transform:scale(.96); box-shadow:0 0 0 6px var(--blue-soft); }
  .end small { display:block; color:var(--muted); margin-top:10px; font-size:12px; }

  /* step 6 */
  .fld label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .fld .inp { border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-height:92px; font-size:13px; line-height:1.5; background:var(--panel); }
  .todo { display:flex; gap:9px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; animation:fade .25s ease; }
  .cb { width:15px; height:15px; border:1.5px solid var(--line); border-radius:4px; flex:none; }
  .savebar { display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:14px; }
  .okbanner { flex:1; background:var(--blue-soft); border:1px solid var(--blue-line); color:var(--blue); border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600; animation:fade .3s ease; }
  .savebtn { border:0; background:var(--blue); color:#fff; border-radius:8px; padding:9px 18px; font-weight:600; font-size:13px; transition:transform .15s; }
  .savebtn.pressed { transform:scale(.94); box-shadow:0 0 0 5px var(--blue-soft); }

  /* step 7 */
  .rec { border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:8px; overflow:hidden; }
  .rec .rh { display:flex; align-items:center; gap:10px; padding:11px 14px; font-size:13px; }
  .rec .rh .m { margin-left:auto; color:var(--muted); font:12px var(--mono); }
  .rec .chev { color:var(--muted); transition:transform .2s; }
  .rec.open .chev { transform:rotate(90deg); }
  .rec .rb2 { padding:0 14px 12px; font-size:12.5px; color:var(--muted); line-height:1.55; }
  .rec .rb2 b { color:var(--ink); }
  .rec.new { border-color:var(--blue-line); box-shadow:0 0 0 3px var(--blue-soft); animation:fade .4s ease; }
  .newtag { font:600 9px var(--mono); letter-spacing:.08em; color:var(--blue); background:var(--blue-soft); border:1px solid var(--blue-line); border-radius:4px; padding:1px 6px; }
  .rec .trash { opacity:.5; }
  .sec-h { font:500 10px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }

  footer { max-width:1360px; margin:0 auto; padding:0 24px 40px; color:var(--muted); font-size:12px; }

  @media (max-width: 560px) {
    .top { padding:12px 16px; gap:8px; flex-wrap:wrap; }
    .spacer { flex:1 1 0; min-width:0; }
    .logo { font-size:17px; }
    .visit { padding:7px 11px; font-size:12px; }
    .langsel select { padding:5px 26px 5px 10px; font-size:12px; }
    main, footer { padding-left:16px; padding-right:16px; }
    .win-body { padding:14px; }
    .controls { gap:6px; }
  }
  @media (max-width: 1060px) {
    .stage { grid-template-columns:minmax(0,1fr); }
    .pipe { min-width:0; }
    .pipe { padding:8px; }
    #steps { display:flex; overflow-x:auto; }
    .pipe .cap { display:none; }
    .step { flex:none; min-width:170px; }
    .log { min-height:200px; } .log-list { max-height:260px; }
    .two { grid-template-columns:1fr; }
    h1 { font-size:27px; }
    .choose { grid-template-columns:1fr; }
    .win { min-height:480px; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="https://www.oneinbox.ai" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg>
    OneInbox
  </a>
  <div class="langsel"><select id="lang" aria-label="Language"><option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option></select></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme" aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <a class="visit" id="visit" href="https://www.oneinbox.ai" target="_blank" rel="noopener">Visit oneinbox.ai</a>
</header>

<main>
  <section class="hero">
    <div>
      <h1 id="h1"></h1>
      <p class="desc" id="desc"></p>
      <p class="disc" id="disc"></p>
    </div>
    <div class="controls">
      <span class="pill" id="trainee"></span>
      <span class="seg" id="ucseg"><button data-uc="inbound"></button><button data-uc="outbound"></button></span>
      <span class="seg" id="spdseg"><button data-s="0.6">0.6×</button><button data-s="1" class="on">1×</button><button data-s="1.8">1.8×</button></span>
      <button class="btn" id="restart"></button>
      <button class="btn dark" id="pause"></button>
    </div>
  </section>
  <div class="bar"><i id="prog"></i></div>

  <section class="stage">
    <aside class="card pipe"><div class="cap"><span id="pipeLbl"></span><span id="pipeCnt"></span></div><div id="steps"></div></aside>
    <div class="card win">
      <div class="win-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="ttl" id="wTitle"></span><span class="lbl" id="wLbl"></span></div>
      <div class="win-body" id="body"></div>
      <div class="win-foot"><span class="n" id="fN"></span><span id="fText"></span></div>
    </div>
    <aside class="card log"><div class="cap"><span id="logLbl"></span></div><div class="log-list" id="log"></div></aside>
  </section>
</main>
<footer id="foot"></footer>
<noscript><p style="padding:24px">This demo needs JavaScript.</p></noscript>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const PH = '<path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6a1 1 0 0 0-1 .2l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .3-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/>';
const ICO_IN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v6h6"/><path d="M22 2l-6 6"/><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const ICO_OUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8V2h-6"/><path d="M16 8l6-6"/><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const ICO_CALL = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">${PH}</svg>`;
const ICO_HANG = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)">${PH}</svg>`;
const ICO_USER = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';

    su.textContent = cur; su.classList.toggle("caret", cur.length < full.length);
    const per = lang === "ja" ? 0.45 : 1, typedMs = full.length / (cps * per) * 1000, t0 = s0 + typedMs + 400;
    const nTodo = Math.max(0, Math.min(d.todos.length, Math.floor((t - t0) / 900) + 1));
    if (td.children.length !== nTodo) td.innerHTML = d.todos.slice(0, nTodo).map(x => `<div class="todo"><span class="cb"></span><span>${esc(x)}</span></div>`).join("");
    const tSave = t0 + d.todos.length * 900 + 500;
    $("#sb").classList.toggle("pressed", t > tSave && t < tSave + 600);
    const ob = $("#ob"), want = t > tSave + 300;
    if (want && !ob.firstChild) ob.innerHTML = `<span class="okbanner">${esc(U().savedBy)}</span>`;
    if (!want && ob.firstChild) ob.innerHTML = "";
  }
 },
 { // 7 history
  mount() {
    const u = U(), d = D();
    body.innerHTML = `<div class="sec-h">${esc(u.recent)}</div><div id="rc"></div>`;
    this.d = d;
  },
  update(t) {
    const u = U(), d = D(), open = t > 2600, show = t > 500;
    const html = (show ? `<div class="rec new ${open?"open":""}"><div class="rh">${CHEV}<b>${esc((uc==="inbound"?u.inCall:u.outCall)+" · "+d.call)}</b><span class="newtag">${esc(u.newT)}</span><span class="m">11/02 · ${esc(d.dur)}</span>${TRASH}</div>${open?`<div class="rb2"><b>${esc(u.sumL)}</b><br>${esc(d.summary)}<br><br><b>${esc(u.todoL)}</b><br>${d.todos.map(x=>"☐ "+esc(x)).join("<br>")}</div>`:""}</div>` : "")
      + d.older.map(o => `<div class="rec"><div class="rh">${CHEV}<span>${esc(o[0])}</span><span class="m">${esc(o[1])}</span>${TRASH}</div></div>`).join("");
    const rc = $("#rc"); if (rc.dataset.h !== html) { rc.dataset.h = html; rc.innerHTML = html; }
  }
 }
];

/* ------------------------------------------------------------------ chrome */
function buildStepList() {
  const u = U();
  $("#steps").innerHTML = u.steps.map((s, i) => `<div class="step" data-i="${i}"><span class="num">${i+1}</span><div><div class="st-title">${esc(s[0])}</div><div class="st-sub">${esc(s[1])}</div><span class="tag ${KINDS[i]}">${esc(u.tags[KINDS[i]])}</span></div></div>`).join("");
  $("#steps").querySelectorAll(".step").forEach(n => n.onclick = () => jump(+n.dataset.i));
}
function applyText() {
  const u = U(); document.documentElement.lang = lang;
  $("#h1").textContent = u.title; $("#desc").textContent = u.desc; $("#disc").textContent = u.disc;
  $("#restart").textContent = u.restart; $("#pause").textContent = paused ? u.resume : u.pause;
  $("#pipeLbl").textContent = u.pipeline; $("#logLbl").textContent = u.log; $("#visit").textContent = u.visit;
  $("#ucseg").querySelectorAll("button").forEach(b => { b.textContent = u[b.dataset.uc]; b.classList.toggle("on", b.dataset.uc === uc); });
  $("#foot").textContent = u.foot; document.title = u.title + " – Role Play demo";
  buildStepList(); mounted = -1;
}
function rebuildLog(upTo) {
  const list = $("#log"); list.innerHTML = ""; logCount = 0;
  for (let i = 0; i < upTo; i++) LOGS[lang][uc][i].forEach(e => addLog(e));
  logCount = 0;
}
function addLog(e) {
  const li = document.createElement("div"); li.className = "li";
  li.innerHTML = `<span class="tm">${e[0]}</span><span class="tx">${esc(e[1])}<span class="src ${e[2]}">${esc(SRC[lang][e[2]])}</span></span>`;
  const list = $("#log"); list.appendChild(li); list.scrollTop = list.scrollHeight;
}
function jump(i) { si = Math.max(0, Math.min(i, S.length - 1)); el = 0; rebuildLog(si); mounted = -1; render(); }
function restart() { jump(0); paused = false; $("#pause").textContent = U().pause; }

function traineeCount() {
  let n = 0; TRAINEE_STEPS.forEach(k => { if (k < si || (k === si && el / DUR[si] > 0.72)) n++; });
  return n;
}
function render() {
  const u = U();
  if (mounted !== si) {
    mounted = si; S[si].mount();
    $("#wTitle").textContent = u.win[si][0]; $("#wLbl").textContent = u.win[si][1];
    $("#fN").textContent = String(si + 1).padStart(2, "0"); $("#fText").textContent = u.cap[si];
    if (si === 1 && uc === "outbound") { /* caption adjusted by text */ }
    document.querySelectorAll(".step").forEach((n, i) => { n.classList.toggle("active", i === si); n.classList.toggle("done", i < si); });
    $("#pipeCnt").textContent = (si + 1) + " / " + S.length;
    const a = $("#steps").children[si]; if (a && a.scrollIntoView && window.innerWidth <= 1060) a.scrollIntoView({block:"nearest", inline:"center"});
  }
  S[si].update(el);
  const l = LOGS[lang][uc][si];
  while (logCount < l.length && el >= (logCount + 0.5) * (DUR[si] / (l.length + 0.5)) * 0.9) addLog(l[logCount++]);
  $("#prog").style.width = ((si + Math.min(el / DUR[si], 1)) / S.length * 100) + "%";
  $("#trainee").innerHTML = `${esc(u.trainee)} <b>${traineeCount()} / ${TRAINEE_STEPS.length}</b>`;
}
function tick(now) {
  const dt = Math.min(now - last, 100); last = now;
  if (!paused) {
    el += dt * speed;
    if (el >= DUR[si]) {
      if (si < S.length - 1) { render(); si++; el = 0; logCount = 0; }
      else { el = DUR[si]; }
    }
  }
  render(); requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ events */
$("#lang").onchange = e => { lang = e.target.value; applyText(); rebuildLog(si); render(); };
$("#ucseg").onclick = e => { const b = e.target.closest("button"); if (!b) return; uc = b.dataset.uc; applyText(); restart(); };
$("#spdseg").onclick = e => { const b = e.target.closest("button"); if (!b) return; speed = +b.dataset.s; $("#spdseg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
$("#restart").onclick = restart;
$("#pause").onclick = () => { paused = !paused; $("#pause").textContent = paused ? U().resume : U().pause; };
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};
try { const q = new URLSearchParams(location.search); if (q.get("lang") === "ja") { lang = "ja"; $("#lang").value = "ja"; } if (q.get("uc") === "outbound") uc = "outbound"; } catch (e) {}

// small hook so the walkthrough can be inspected frame by frame
window.__demo = { seek(step, ms, o = {}) { if (o.lang) { lang = o.lang; $("#lang").value = lang; } if (o.uc) uc = o.uc; applyText(); si = step; el = ms; rebuildLog(si); mounted = -1; paused = true; render(); } };

applyText(); rebuildLog(0); render(); requestAnimationFrame(tick);
})();
</script>
